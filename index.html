<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☀️ REAL SUMMER STYLE DECK ☀️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(to bottom, #11052C 0%, #190033 50%, #800080 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .grid-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(148, 0, 211, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 0, 211, 0.2) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0;
            transform: perspective(200px) rotateX(60deg);
            transform-origin: top;
            animation: gridMove 2.5s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 30px; }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 10px #9400D3, 0 0 20px #800080;
            margin-bottom: 25px;
            z-index: 1;
            text-align: center;
        }

        .studio-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: row;
            gap: 40px;
            background: rgba(17, 5, 44, 0.85);
            border: 2px solid #9400D3;
            box-shadow: 0 0 30px rgba(148, 0, 211, 0.4), inset 0 0 15px rgba(128, 0, 128, 0.3);
            backdrop-filter: blur(8px);
            padding: 30px;
            border-radius: 16px;
            max-width: 950px;
            width: 100%;
        }

        .avatar-canvas {
            flex: 1;
            background: rgba(5, 1, 15, 0.6);
            border: 1px solid rgba(148, 0, 211, 0.4);
            border-radius: 12px;
            height: 480px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        .synth-sun {
            position: absolute;
            width: 240px;
            height: 240px;
            background: linear-gradient(to bottom, #ff007f, #ff8c00);
            border-radius: 50%;
            bottom: 30px;
            z-index: 1;
            opacity: 0.25;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.4);
        }

        .clothing-layer {
            position: absolute;
            z-index: 2;
            max-width: 65%;
            max-height: 55%;
            object-fit: contain;
            transition: all 0.2s ease-in-out;
            border-radius: 8px;
        }

        #layer-acc    { z-index: 5; top: 8%; height: 22%; }
        #layer-top    { z-index: 4; top: 26%; height: 32%; }
        #layer-bottom { z-index: 3; top: 52%; height: 30%; }
        #layer-shoes  { z-index: 2; bottom: 6%; height: 16%; }

        .right-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
        }

        .wardrobe-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slot-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(148, 0, 211, 0.3);
            border-radius: 10px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .slot-info { text-align: left; }

        .slot-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #00f0ff;
            text-transform: uppercase;
        }

        .slot-selection-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
