<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☀️ SUMMER STUDIO ☀️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(to bottom, #11052C 0%, #190033 50%, #4a0e4e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Recreates your exact neon perspective wireframe grid */
        .grid-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(148, 0, 211, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 0, 211, 0.3) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            transform: perspective(240px) rotateX(60deg);
            transform-origin: top;
            animation: gridMove 3s linear infinite;
            opacity: 0.7;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.6rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 10px #9400D3, 0 0 20px #ff007f;
            margin-bottom: 25px;
            z-index: 1;
            text-align: center;
        }

        .studio-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: row;
            gap: 40px;
            background: rgba(12, 3, 33, 0.9);
            border: 2px solid #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.4), inset 0 0 15px rgba(148, 0, 211, 0.3);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            max-width: 950px;
            width: 100%;
        }

        .avatar-canvas {
            flex: 1;
            background: rgba(5, 1, 15, 0.75);
            border: 1px solid rgba(255, 0, 127, 0.3);
            border-radius: 12px;
            height: 480px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        .synth-sun {
            position: absolute;
            width: 260px;
            height: 260px;
            background: linear-gradient(to bottom, #ff007f, #ff8c00);
            border-radius: 50%;
            bottom: -20px;
            z-index: 1;
            opacity: 0.3;
            box-shadow: 0 0 50px rgba(255, 0, 127, 0.5);
        }

        /* Image layered alignment */
        .clothing-layer {
            position: absolute;
            z-index: 2;
            max-width: 70%;
            max-height: 45%;
            object-fit: contain;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
        }

        #layer-acc    { z-index: 5; top: 10%; height: 18%; max-width: 45%; }
        #layer-top    { z-index: 4; top: 24%; height: 32%; }
        #layer-bottom { z-index: 3; top: 50%; height: 30%; }
        #layer-shoes  { z-index: 2; bottom: 8%; height: 16%; }

        .right-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
        }

        .wardrobe-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slot-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(148, 0, 211, 0.4);
            border-radius: 10px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .slot-info { text-align: left; }

        .slot-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #00f0ff;
            text-transform: uppercase;
        }

        .slot-selection-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }

        .arrow-btn {
            background: transparent;
            color: #ff007f;
            border: 1px solid #ff007f;
            font-size: 1rem;
            width: 34px;
            height: 34px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .arrow-btn:hover {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 12px #ff007f;
        }

        .arrow-group { display: flex; gap: 8px; }

        .rating-box {
            background: rgba(5, 1, 15, 0.8);
            border: 1px dashed #00f0ff;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .rating-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: #00f0ff;
            text-shadow: 0 0 10px #00f0ff;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid #00f0ff;
            padding: 10px 15px;
            border-radius: 8px;
            min-width: 90px;
            text-align: center;
        }

        .critique-text {
            text-align: left;
            font-size: 1.1rem;
            font-weight: 600;
            color: #dfbfff;
            line-height: 1.3;
        }

        .random-trigger {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff007f, #9400D3);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(148, 0, 211, 0.4);
            transition: all 0.2s ease;
        }

        .random-trigger:hover {
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.7);
        }

        @media (max-width: 768px) {
            .studio-container { flex-direction: column; }
            .avatar-canvas { height: 350px; }
        }
    </style>
</head>
<body>

    <div class="grid-background"></div>

    <h1>SUMMER STUDIO</h1>

    <div class="studio-container">
        
        <div class="avatar-canvas">
            <div class="synth-sun"></div>
            
            <img id="layer-acc" class="clothing-layer" src="" alt="Accessory">
            <img id="layer-top" class="clothing-layer" src="" alt="Top">
            <img id="layer-bottom" class="clothing-layer" src="" alt="Bottom">
            <img id="layer-shoes" class="clothing-layer" src="" alt="Shoes">
        </div>

        <div class="right-panel">
            <div class="wardrobe-controls">
                
                <div class="slot-card">
                    <div class="slot-info">
                        <div class="slot-label">01 // Torso Layer</div>
                        <div id="text-top" class="slot-selection-name">...</div>
                    </div>
                    <div class="arrow-group">
                        <button class="arrow-btn" onclick="cycle('top', -1)">◀</button>
                        <button class="arrow-btn" onclick="cycle('top', 1)">▶</button>
                    </div>
                </div>

                <div class="slot-card">
                    <div class="slot-info">
                        <div class="slot-label">02 // Lower Layer</div>
                        <div id="text-bottom" class="slot-selection-name">...</div>
                    </div>
                    <div class="arrow-group">
                        <button class="arrow-btn" onclick="cycle('bottom', -1)">◀</button>
                        <button class="arrow-btn" onclick="cycle('bottom', 1)">▶</button>
                    </div>
                </div>

                <div class="slot-card">
                    <div class="slot-info">
                        <div class="slot-label">03 // Head & Acc</div>
                        <div id="text-acc" class="slot-selection-name">...</div>
                    </div>
                    <div class="arrow-group">
                        <button class="arrow-btn" onclick="cycle('acc', -1)">◀</button>
                        <button class="arrow-btn" onclick="cycle('acc', 1)">▶</button>
                    </div>
                </div>

                <div class="slot-card">
                    <div class="slot-info">
                        <div class="slot-label">04 // Footwear</div>
                        <div id="text-shoes" class="slot-selection-name">...</div>
                    </div>
                    <div class="arrow-group">
                        <button class="arrow-btn" onclick="cycle('shoes', -1)">◀</button>
                        <button class="arrow-btn" onclick="cycle('shoes', 1)">▶</button>
                    </div>
                </div>
            </div>

            <div class="rating-box">
                <div id="vibe-score" class="rating-badge">0.0</div>
                <div id="vibe-critique" class="critique-text">Evaluating combination...</div>
            </div>

            <button class="random-trigger" onclick="spinRandom()">Randomize Fit</button>
        </div>

    </div>

            ],
            bottom: [
                { name: "Light Wash Denim Skirt", url: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFAAAABQCAMAAAC53vnoAAAAWlBMVEUAAADQ0ND///87Ozs/Pz9PT09TU1NTU1NTU1NOTk5PT09PT09SUlJTU1NUVFRVVVVVVVVVVVVPT09TU1NRUVFTU1NUVFRVVVVPT09VVVVVVVVVVVVVVVVVVVVw71o8AAAAH3RSTlMAwMDe4PDw7/D06vP08vTu8vTy9vT09vTy8vT08vJuS7G2AAABJElEQVRYw+3V226DMAwF0NIG0pYChS3v//9ZM6mTLp7Sqn3BeVzEWe0NxgGgXQL4T87ZpZzLclXOpL4P8sN5Uga5kFfXkvwKuaF3y6rrc5ZzWa7Im+tYfctSllXkyXWsfscayzXnRcnLIidJ5BFrXHJelFzIWRJ5wBr3XBeVBzlPIvNYS86ZPEg9ieSp5Zwy2ZPyTSSPteScKZ6UbiInSeT7978qk9wR0S0RnSTy9Ptf6pByRUR3RHSWyI7oWIdUT6Q6IjWRqomUR6REpMREmkykWZf6k7IscidFREREREREREREREREREREROTvWjN6m+uP9X6/O9/m+tG8pX/qj37M+6ofY36b8Z/8G/g3eXub0tsVbK0C6mEC/qIu5WcAAAAASUVORK5CYII=", vibe: "coastal" },

            ],
            acc: [
                { name: "Dark Acetate Sunglasses", url: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFAAAAA8CAMAAADYKdfpAAAAG1BMVEUAAABEREQ6OjpVVVVVVVVVVVVVVVVVVVVVVVTAn0P9AAAACXRSTlMA9O7y9vTy9vIy8N+EAAAAQklEQVRYw+3VwQkAMAgEMDHdf9N+VEEUfInAncDvVpWW3v3ZfI0+o0/pM/qMPqPP6DP6lD6jT+kz+pQ+o8/o8zf7fQF/7ADzYm0+wQAAAABJRU5ErkJggg==", vibe: "coastal" }
            ],
            shoes: [
                { name: "Adidas Campus Navy", url: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFAAAABQCAMAAAC53vnoAAAAP1BMVEUAAAAsLCw6OjpMTEw9PT1NTU1SUlJTU1NTU1NPT09PT09SUlJTU1NUVFRVVVVVVVVPT09TU1NRUVFTU1NUVFRpBwXJAAAADnRSTlMAmrzA3uDw8vby9vby8gsh7+QAAADjSURBVFjD7ddbDoMwEAVQG2wDppfQAAn//7MmhvKRp3bVvsg+JsC0DqAtA3g0iUGjUTQapWRb13UkTbYoj4vIiyd0e89679f0F/uSjkajSPTf5vvSfre7b6v9SEejUSRl2fruc7Zb331OdvsuikaT6L+l9hD5XbI7RH6XbO/VdIuikSR6P+T3w956XfIeRNFokrT7Pr8f9tbrkvfgP7n3960GgGZfRLP/RDR/K6LZeSK63Zek7YvoXkp6X0T3UtL7IrqXkt4X0b2U9L6I7qWk90V0LyW9L6J78ff1id4v286+bdu+tP+r6Uu7b9veb60Rib6b6F/6Xvrbz9+tXde1XdeNkW8W+By/1hV4xQAAAABJRU5ErkJggg==", vibe: "coastal" },
                { name: "Comfort Slides Black", url: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFAAAABQCAMAAAC53vnoAAAANlBMVEUAAACpqalMTEw9PT1NTU1SUlJTU1NTU1NPT09PT09SUlJTU1NUVFRVVVVVVVVPT09TU1NRUVFTYvjUAAAADnRSTlMAr9Dg8PD09PL28vby8jUvH/wAAADaSURBVFjD7ddbDoQgEAVQEMX73860uYmJi8FExD0u4G0TIDYDhDYAnpMlaEwWjSUpXN91WUaKXIvytSgfi8R9Zz+PazzFn7xpTJaM/re+z7fPvXyff++msST9t2p7mO3WewfeR7Y9zGbpiZLfXbE9m/I7294r2e6W9B6Tf7m+96x7R9p7TP7V976V9p6U9h7Tfe+9X6Xdp6S9x+Tfe+9X6R0p7T0W++7bvpE2n6v2mWyfyd6f0vYz7f6mY7LojKz3p6bfe+97edvPZBlZMoZ8An8AHC6bYh6hAAAAAElFTUSuQmCC", vibe: "street" }
            ]
        };

        const indices = { top: 0, bottom: 0, acc: 0, shoes: 0 };

        function render() {
            for (let category in assets) {
                const item = assets[category][indices[category]];
                if (!item) continue;
                
                document.getElementById(`text-${category}`).innerText = item.name;
                document.getElementById(`layer-${category}`).src = item.url;
            }
            rateOutfit();
        }

        function cycle(category, step) {
            const list = assets[category];
            indices[category] = (indices[category] + step + list.length) % list.length;
            render();
        }

        function spinRandom() {
            for (let category in indices) {
                if (assets[category].length > 0) {
                    indices[category] = Math.floor(Math.random() * assets[category].length);
                }
            }
            render();
        }

        function rateOutfit() {
            const currentVibes = [
                assets.top[indices.top]?.vibe,
                assets.bottom[indices.bottom]?.vibe,
                assets.acc[indices.acc]?.vibe,
                assets.shoes[indices.shoes]?.vibe
            ].filter(Boolean);

            let vibeCounts = {};
            currentVibes.forEach(v => vibeCounts[v] = (vibeCounts[v] || 0) + 1);
            let maxMatch = Math.max(...Object.values(vibeCounts), 0);

            let score = 7.5;
            let text = "✨ ECLECTIC HYBRID! Unique mix match compilation.";

            if (maxMatch === currentVibes.length) {
                score = 10.0;
                text = "⚡ AESTHETIC HARMONY! Perfect mood board look pairing.";
            } else if (maxMatch >= 2) {
                score = 9.2;
                text = "🔥 SYNC STABLE! Great structural flow across layout tracks.";
            }

            document.getElementById("vibe-score").innerText = score.toFixed(1);
            document.getElementById("vibe-critique").innerText = text;
        }

        window.onload = render;
    </script>
</body>
</html>
