<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☀️ SUMMER DRESS-UP STUDIO ☀️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            /* Recreates the tropical synthwave beach sunset sky from your reference image */
            background: linear-gradient(180deg, #3a478a 0%, #7d539b 35%, #ca5292 60%, #f37d7a 80%, #f7b070 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Beautiful retro stylized sun and ocean horizon lines */
        .scenery-background {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 50% 65%, #fee685 0%, #f69469 15%, transparent 40%),
                linear-gradient(to top, #ca587e 0%, #ca587e 12%, transparent 12%);
            background-size: 100% 100%;
            z-index: 0;
            opacity: 0.85;
        }

        .scenery-sea-lines {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 12%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.15) 2px, transparent 2px);
            background-size: 100% 8px;
            z-index: 1;
        }

        /* Palm tree neon glow silhouettes on the left */
        .palm-left {
            position: absolute;
            left: 5%;
            bottom: 12%;
            font-size: 8rem;
            opacity: 0.25;
            z-index: 1;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #ff00ff;
            user-select: none;
        }

        .main-layout {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 1050px;
            width: 100%;
            gap: 20px;
        }

        /* Stylized wooden hanging sign matching the reference UI title card */
        .wooden-signboard {
            background: linear-gradient(135deg, #b07c56 0%, #8e5934 100%);
            border: 5px solid #63391c;
            border-radius: 12px;
            padding: 15px 40px;
            text-align: center;
            box-shadow: 0 10px 0 #42220d, 0 12px 20px rgba(0,0,0,0.4);
            position: relative;
            transform: rotate(-1deg);
            margin-bottom: 10px;
        }

        .wooden-signboard::before, .wooden-signboard::after {
            content: '🔗';
            position: absolute;
            top: -22px;
            font-size: 1.5rem;
        }
        .wooden-signboard::before { left: 25px; }
        .wooden-signboard::after { right: 25px; }

        .wooden-signboard h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.3rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #cf6ba3, -2px -2px 0px #4ec7eb, 3px 5px 0px rgba(0,0,0,0.5);
            line-height: 1.1;
        }

        .wooden-sub {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #ffeb3b;
            text-transform: uppercase;
            margin-top: 4px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .studio-container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            width: 100%;
            align-items: stretch;
        }

        /* Centralized dress-up backdrop matching the giant pink sunset circle framing */
        .avatar-panel {
            flex: 1;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            height: 520px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sun-frame-backdrop {
            position: absolute;
            width: 320px;
            height: 320px;
            background: linear-gradient(180deg, #ff2a85 0%, #ff7300 100%);
            border-radius: 50%;
            bottom: 40px;
            z-index: 1;
            box-shadow: 0 0 40px rgba(255, 42, 133, 0.6);
        }

        /* Clothes stacking coordinates matching your layout sketches */
        .clothing-layer {
            position: absolute;
            z-index: 3;
            max-width: 65%;
            max-height: 50%;
            object-fit: contain;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.4));
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.25);
        }

        #layer-acc    { z-index: 6; top: 18%; height: 12%; max-width: 40%; }
        #layer-top    { z-index: 5; top: 28%; height: 28%; }
        #layer-bottom { z-index: 4; top: 48%; height: 26%; }
        #layer-shoes  { z-index: 3; bottom: 10%; height: 14%; }

        /* Right panel with item categories inside frosted glass boxes */
        .wardrobe-panel {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
        }

        .category-info {
            text-align: left;
        }

        .category-tag {
            font-family: 'Fredoka One', cursive;
            font-size: 0.85rem;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
        }

        .item-display-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            margin-top: 2px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
        }

        .navigation-arrows {
            display: flex;
            gap: 10px;
        }

        /* Bright pink glowing stylized round arrow selectors */
        .nav-btn {
            background: linear-gradient(135deg, #ff2a85 0%, #ff0055 100%);
            color: #fff;
            border: 2px solid #ffffff;
            font-size: 1.1rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(255, 0, 85, 0.4), inset 0 2px 4px rgba(255,255,255,0.4);
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px #ff0055;
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        /* Bottom action section matching the reference dashboard */
        .actions-row {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .vibe-meter {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #00ffff;
            border-radius: 16px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .vibe-score-badge {
            font-family: 'Fredoka One', cursive;
            font-size: 1.8rem;
            color: #00f0ff;
            text-shadow: 0 0 8px #00f0ff;
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid #00f0ff;
            padding: 6px 12px;
            border-radius: 10px;
        }

        .vibe-text {
            font-size: 1rem;
            font-weight: 700;
            color: #e3f9ff;
            text-align: left;
        }

        .random-fit-btn {
            font-family: 'Fredoka One', cursive;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #00f0ff 0%, #00a8ff 100%);
            color: #fff;
            border: 3px solid #ffffff;
            padding: 0 30px;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 168, 255, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .random-fit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px #00f0ff;
        }

        @media (max-width: 768px) {
            .studio-container { flex-direction: column; }
            .avatar-panel { height: 380px; }
            .actions-row { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="scenery-background"></div>
    <div class="scenery-sea-lines"></div>
    <div class="palm-left">🌴</div>

    <div class="main-layout">
        
        <div class="wooden-signboard">
            <h1>Summer Dress-Up</h1>
            <div class="wooden-sub">Vibe Mixer</div>
        </div>

        <div class="studio-container">
            
            <div class="avatar-panel">
                <div class="sun-frame-backdrop"></div>
                
                <img id="layer-acc" class="clothing-layer" src="" alt="Accessory">
                <img id="layer-top" class="clothing-layer" src="" alt="Top">
                <img id="layer-bottom" class="clothing-layer" src="" alt="Bottom">
                <img id="layer-shoes" class="clothing-layer" src="" alt="Shoes">
            </div>

            <div class="wardrobe-panel">
                
                <div class="category-card">
                    <div class="category-info">
                        <div class="category-tag">👚 Torso / Tops</div>
                        <div id="text-top" class="item-display-name">...</div>
                    </div>
                    <div class="navigation-arrows">
                        <button class="nav-btn" onclick="cycle('top', -1)">◀</button>
                        <button class="nav-btn" onclick="cycle('top', 1)">▶</button>
                    </div>
                </div>

                <div class="category-card">
                    <div class="category-info">
                        <div class="category-tag">🩳 Lower / Bottoms</div>
                        <div id="text-bottom" class="item-display-name">...</div>
                    </div>
                    <div class="navigation-arrows">
                        <button class="nav-btn" onclick="cycle('bottom', -1)">◀</button>
                        <button class="nav-btn" onclick="cycle('bottom', 1)">▶</button>
                    </div>
                </div>

                <div class="category-card">
                    <div class="category-info">
                        <div class="category-tag">🕶️ Accessories</div>
                        <div id="text-acc" class="item-display-name">...</div>
                    </div>
                    <div class="navigation-arrows">
                        <button class="nav-btn" onclick="cycle('acc', -1)">◀</button>
                        <button class="nav-btn" onclick="cycle('acc', 1)">▶</button>
                    </div>
                </div>

                <div class="category-card">
                    <div class="category-info">
                        <div class="category-tag">👟 Footwear</div>
                        <div id="text-shoes" class="item-display-name">...</div>
                    </div>
                    <div class="navigation-arrows">
                        <button class="nav-btn" onclick="cycle('shoes', -1)">◀</button>
                        <button class="nav-btn" onclick="cycle('shoes', 1)">▶</button>
                    </div>
                </div>

                <div class="actions-row">
                    <div class="vibe-meter">
                        <div id="vibe-score" class="vibe-score-badge">0.0</div>
                        <div id="vibe-critique" class="vibe-text">Evaluating combination...</div>
                    </div>
                    <button class="random-fit-btn" onclick="spinRandom()">Random Fit</button>
                </div>

            </div>

        </div>

    </div>

    <script>
        // High fidelity vector graphic curves representing your actual mood boards items natively
        const assets = {
            top: [
                { name: "Navy Halter Corset Top", url: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M30,20 L70,20 L75,45 L65,85 L35,85 L25,45 Z' fill='%231d2440'/><path d='M30,20 Q50,45 70,20' fill='none' stroke='%23ff007f' stroke-width='2'/><path d='M35,20 L20,5 M65,20 L80,5' stroke='%231d2440' stroke-width='3'/></svg>", vibe: "coastal" },
                { name: "Stüssy World Tour Tee", url: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M20,25 L80,25 L85,45 L70,45 L72,85 L28,85 L30,45 L15,45 Z' fill='%23f5f5f5'/><text x='50' y='55' font-family='sans-serif' font-weight='900' font-size='10' fill='%23111' text-anchor='middle'>STÜSSY</text></svg>", vibe: "street" },
                { name: "Striped Resort Shirt", url: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M20,25 L80,25 L85,50 L70,50 L70,90 L30,90 L30,50 L15,50 Z' fill='%23eaf2f8'/><path d='M38,25 L38,90 M46,25 L46,90 M54,25 L54,90 M62,25 L62,90' stroke='%232874a6' stroke-width='3'/><path d='M50,25 L35,40 M50,25 L65,40' fill='none' stroke='%23eaf2f8' stroke-width='4'/></svg>", vibe: "vintage" }
            ],
            bottom: [
                { name: "Light Wash Denim Skirt", url: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M28,15 L72,15 L80,75 L20,75 Z' fill='%237fb3d5'/><path d='M28,28 L72,28' stroke='%23f7dc6f' stroke-width='1.5' stroke-dasharray='3,2'/><path d='M50,15 L50,32' stroke='%23f7dc6f' stroke-width='1.5'/></svg>", vibe: "coastal" },
                { name: "Grey Nike Sweat Shorts", url: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M25,15 L75,15 L80,65 L52,68 L50,30 L48,68 L20,65 Z' fill='%23bdc3c7'/><circle cx='32' cy='40' r='3' fill='%23fff'/></svg>", vibe: "street" },
                { name: "Navy Pleated Linen Pants", url: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M28,15 L72,15 L76,85 L52,85 L50,35 L48,85 L24,85 Z' fill='%231f2a44'/><path d='M38,20 L38,80 M62,20 L62,80' stroke='%2317202a' stroke-width='1'/></svg>", vibe: "vintage" }
            ],
            acc: [
                { name: "Dark Acetate Sunglasses", url: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 50'><path d='M15,15 L85,15 L82,35 Q70,42 60,35 L55,25 L45,25 L40,35 Q30,42 18,35 Z' fill='%23111111'/><path d='M22,20 L35,20 L32,30 Q25,32 22,25 Z' fill='%23555' opacity='0.6'/><path d='M68,20 L81,20 L78,30 Q71,32 68,25 Z' fill='%23555' opacity='0.6'/></svg>", vibe: "coastal" },
                { name: "Vintage Trucker Cap", url: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 60'><path d='M20,40 C20,10 80,10 80,40 Z' fill='%232471a3'/><path d='M50,40 Q85,40 95,50 L45,52 Z' fill='%23d5f5e3'/></svg>", vibe: "street" }
            ],
            shoes: [
                { name: "Adidas Campus Navy", url: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 50'><path d='M15,35 Q30,10 85,25 L85,42 L15,42 Z' fill='%231a2536'/><path d='M15,42 L85,42 L85,47 L15,47 Z' fill='%23eaecee'/><path d='M45,22 L52,35 M52,20 L59,33 M59,18 L66,31' stroke='%23fff' stroke-width='3'/></svg>", vibe: "coastal" },
                { name: "Comfort Slides Black", url: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 50'><path d='M10,40 Q50,25 90,40 L85,46 L15,46 Z' fill='%231c2833'/><path d='M25,40 Q45,15 70,35' fill='none' stroke='%23111' stroke-width='8'/></svg>", vibe: "street" }
            ]
        };

        const indices = { top: 0, bottom: 0, acc: 0, shoes: 0 };

        function render() {
            for (let category in assets) {
                const item = assets[category][indices[category]];
                if (!item) continue;
                
                document.getElementById(`text-${category}`).innerText = item.name;
                document.getElementById(`layer-${category}`).src = item.url;
            }
            rateOutfit();
        }

        function cycle(category, step) {
            const list = assets[category];
            indices[category] = (indices[category] + step + list.length) % list.length;
            render();
        }

        function spinRandom() {
            for (let category in indices) {
                if (assets[category].length > 0) {
                    indices[category] = Math.floor(Math.random() * assets[category].length);
                }
            }
            render();
        }

        function rateOutfit() {
            const currentVibes = [
                assets.top[indices.top]?.vibe,
                assets.bottom[indices.bottom]?.vibe,
                assets.acc[indices.acc]?.vibe,
                assets.shoes[indices.shoes]?.vibe
            ].filter(Boolean);

            let vibeCounts = {};
            currentVibes.forEach(v => vibeCounts[v] = (vibeCounts[v] || 0) + 1);
            let maxMatch = Math.max(...Object.values(vibeCounts), 0);

            let score = 6.8;
            let text = "✨ MIX MIX! A creative hybrid blend across genres.";

            if (maxMatch === currentVibes.length) {
                score = 10.0;
                text = "⚡ CONGRUENCE MET! Flawless coordination sequence.";
            } else if (maxMatch >= 2) {
                score = 9.0;
                text = "🔥 SYNC STABLE! Solid stylistic alignment matches.";
            }

            document.getElementById("vibe-score").innerText = score.toFixed(1);
            document.getElementById("vibe-critique").innerText = text;
        }

        window.onload = render;
    </script>
</body>
</html>
