<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☀️ REAL SUMMER STYLE DECK ☀️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(to bottom, #11052C 0%, #190033 50%, #800080 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .grid-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(148, 0, 211, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 0, 211, 0.2) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0;
            transform: perspective(200px) rotateX(60deg);
            transform-origin: top;
            animation: gridMove 2.5s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 30px; }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 10px #9400D3, 0 0 20px #800080;
            margin-bottom: 25px;
            z-index: 1;
            text-align: center;
        }

        .studio-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: row;
            gap: 40px;
            background: rgba(17, 5, 44, 0.85);
            border: 2px solid #9400D3;
            box-shadow: 0 0 30px rgba(148, 0, 211, 0.4), inset 0 0 15px rgba(128, 0, 128, 0.3);
            backdrop-filter: blur(8px);
            padding: 30px;
            border-radius: 16px;
            max-width: 950px;
            width: 100%;
        }

        .avatar-canvas {
            flex: 1;
            background: rgba(5, 1, 15, 0.6);
            border: 1px solid rgba(148, 0, 211, 0.4);
            border-radius: 12px;
            height: 480px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        .synth-sun {
            position: absolute;
            width: 240px;
            height: 240px;
            background: linear-gradient(to bottom, #ff007f, #ff8c00);
            border-radius: 50%;
            bottom: 30px;
            z-index: 1;
            opacity: 0.25;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.4);
        }

        /* Displays styling elements nicely in center canvas layout */
        .clothing-display {
            position: absolute;
            font-size: 5.5rem;
            z-index: 2;
            transition: all 0.2s ease-in-out;
            user-select: none;
        }

        #layer-acc    { z-index: 5; top: 15%; }
        #layer-top    { z-index: 4; top: 32%; }
        #layer-bottom { z-index: 3; top: 52%; }
        #layer-shoes  { z-index: 2; bottom: 12%; }

        .right-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
        }

        .wardrobe-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slot-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(148, 0, 211, 0.3);
            border-radius: 10px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .slot-info { text-align: left; }

        .slot-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #00f0ff;
            text-transform: uppercase;
        }

        .slot-selection-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }

        .arrow-btn {
            background: transparent;
            color: #ff007f;
            border: 1px solid #ff007f;
            font-size: 1rem;
            width: 34px;
            height: 34px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .arrow-btn:hover {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 12px #ff007f;
        }

        .arrow-group { display: flex; gap: 8px; }

        .rating-box {
            background: rgba(5, 1, 15, 0.7);
            border: 1px dashed rgba(148, 0, 211, 0.5);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .rating-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: #00f0ff;
            text-shadow: 0 0 10px #00f0ff;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid #00f0ff;
            padding: 10px 15px;
            border-radius: 8px;
            min-width: 90px;
            text-align: center;
        }

        .critique-text {
            text-align: left;
            font-size: 1.1rem;
            font-weight: 600;
            color: #dfbfff;
            line-height: 1.3;
        }

        .random-trigger {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff007f, #9400D3);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(148, 0, 211, 0.4);
            transition: all 0.2s ease;
        }

        .random-trigger:hover {
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.7);
        }

        @media (max-width: 768px) {
            .studio-container { flex-direction: column; }
            .avatar-canvas { height: 350px; }
        }
    </style>
</head>
<body>

    <div class="grid-background"></div>

    <h1>SUMMER STUDIO</h1>

    <div class="studio-container">
        
        <div class="avatar-canvas">
            <div class="synth-sun"></div>
            
            <div id="layer-acc" class="clothing-display"></div>
            <div id="layer-top" class="clothing-display"></div>
            <div id="layer-bottom" class="clothing-display"></div>
            <div id="layer-shoes" class="clothing-display"></div>
        </div>

        <div class="right-panel">
            <div class="wardrobe-controls">
                
                <div class="slot-card">
                    <div class="slot-info">
                        <div class="slot-label">01 // Torso Layer</div>
                        <div id="text-top" class="slot-selection-name">...</div>
                    </div>
                    <div class="arrow-group">
                        <button class="arrow-btn" onclick="cycle('top', -1)">◀</button>
                        <button class="arrow-btn" onclick="cycle('top', 1)">▶</button>
                    </div>
                </div>

                <div class="slot-card">
                    <div class="slot-info">
                        <div class="slot-label">02 // Lower Layer</div>
                        <div id="text-bottom" class="slot-selection-name">...</div>
                    </div>
                    <div class="arrow-group">
                        <button class="arrow-btn" onclick="cycle('bottom', -1)">◀</button>
                        <button class="arrow-btn" onclick="cycle('bottom', 1)">▶</button>
                    </div>
                </div>

                <div class="slot-card">
                    <div class="slot-info">
                        <div class="slot-label">03 // Head & Acc</div>
                        <div id="text-acc" class="slot-selection-name">...</div>
                    </div>
                    <div class="arrow-group">
                        <button class="arrow-btn" onclick="cycle('acc', -1)">◀</button>
                        <button class="arrow-btn" onclick="cycle('acc', 1)">▶</button>
                    </div>
                </div>

                <div class="slot-card">
                    <div class="slot-info">
                        <div class="slot-label">04 // Footwear</div>
                        <div id="text-shoes" class="slot-selection-name">...</div>
                    </div>
                    <div class="arrow-group">
                        <button class="arrow-btn" onclick="cycle('shoes', -1)">◀</button>
                        <button class="arrow-btn" onclick="cycle('shoes', 1)">▶</button>
                    </div>
                </div>
            </div>

            <div class="rating-box">
                <div id="vibe-score" class="rating-badge">0.0</div>
                <div id="vibe-critique" class="critique-text">Processing fit data...</div>
            </div>

            <button class="random-trigger" onclick="spinRandom()">Randomize Fit</button>
        </div>

    </div>

    <script>
        // Uses native system symbols so that it works automatically everywhere without dependencies
        const assets = {
            top: [
                { name: "Navy Halter Corset Top", char: "🎽", vibe: "coastal_chic" },
                { name: "Stüssy World Tour Tee", char: "👕", vibe: "streetwear" },
                { name: "Polo Knit Zip Hoodie", char: "🧥", vibe: "casual" },
                { name: "Striped Resort Shirt", char: "👔", vibe: "resort" }
            ],
            bottom: [
                { name: "Light Wash Denim Skirt", char: "👗", vibe: "coastal_chic" },
                { name: "Grey Nike Sweat Shorts", char: "🩳", vibe: "streetwear" },
                { name: "Light Wash Relaxed Jeans", char: "👖", vibe: "casual" },
                { name: "Navy Pleated Linen Pants", char: "👖", vibe: "resort" }
            ],
            acc: [
                { name: "Dark Acetate Sunglasses", char: "🕶️", vibe: "coastal_chic" },
                { name: "Vintage Trucker Hat", char: "🧢", vibe: "resort" },
                { name: "Minimalist Silver Chain", char: "📿", vibe: "casual" }
            ],
            shoes: [
                { name: "Adidas Campus Navy", char: "👟", vibe: "coastal_chic" },
                { name: "Yeezy-Style Slides Black", char: "🩴", vibe: "streetwear" },
                { name: "Taupe Suede Birkenstocks", char: "🥿", vibe: "resort" }
            ]
        };

        const indices = { top: 0, bottom: 0, acc: 0, shoes: 0 };

        function render() {
            for (let category in assets) {
                const item = assets[category][indices[category]];
                if (!item) continue;
                
                document.getElementById(`text-${category}`).innerText = item.name;
                document.getElementById(`layer-${category}`).innerText = item.char;
            }
            rateOutfit();
        }

        function cycle(category, step) {
            const list = assets[category];
            indices[category] = (indices[category] + step + list.length) % list.length;
            render();
        }

        function spinRandom() {
            for (let category in indices) {
                if (assets[category].length > 0) {
                    indices[category] = Math.floor(Math.random() * assets[category].length);
                }
            }
            render();
        }

        function rateOutfit() {
            const currentVibes = [
                assets.top[indices.top]?.vibe,
                assets.bottom[indices.bottom]?.vibe,
                assets.acc[indices.acc]?.vibe,
                assets.shoes[indices.shoes]?.vibe
            ].filter(Boolean);

            let vibeCounts = {};
            currentVibes.forEach(v => vibeCounts[v] = (vibeCounts[v] || 0) + 1);
            let maxMatch = Math.max(...Object.values(vibeCounts), 0);

            let score = 7.5;
            let text = "✨ ECLECTIC HYBRID! Creative aesthetic mix from your design boards.";

            if (maxMatch === currentVibes.length) {
                score = 10.0;
                text = "⚡ LOOK CONGRUENCE MET! Perfect aesthetic cohesion from your layout board.";
            } else if (maxMatch >= 2) {
                score = 9.2;
                text = "🔥 SYNC STABLE! Clean color block and sub-genre coordination detected.";
            }

            document.getElementById("vibe-score").innerText = score.toFixed(1);
            document.getElementById("vibe-critique").innerText = text;
        }

        window.onload = spinRandom;
    </script>
</body>
</html>
